services:
  postgres:
    image: postgres:16
    container_name: taskflow_postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskflow

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/taskflow
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres_data: